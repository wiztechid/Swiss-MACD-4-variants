name: Update SWISS Forward Test

on:
  schedule:
    - cron: '0 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiss-forward-test
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update live signals and forward history
        run: python update_live.py

      - name: Commit updated data
        run: |
          git config user.name "wiss-bot"
          git config user.email "actions@users.noreply.github.com"
          git add live_signals.json live_state.json
          git diff --cached --quiet || git commit -m "WISS forward auto update"
          git push
